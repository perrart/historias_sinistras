; HISTÓRIAS SINISTRAS — M5Stack Cardputer ADV (ESP32-S3, 8 MB de flash)
;
; Compilar:            pio run
; Gravar via USB:      pio run -t upload
; Monitor serial:      pio device monitor
;
; Após a compilação, o script tools/pio_merge_bin.py gera em release/:
;   historias_sinistras.bin       imagem COMPLETA (bootloader + partições + app) -> gravar em 0x0
;   historias_sinistras_app.bin   somente o aplicativo                          -> gravar em 0x10000
;
; A plataforma pioarduino 55.03.312 traz o Arduino-ESP32 3.3.12 (ESP-IDF 5.5), a mesma
; versão usada no binário distribuído. As bibliotecas estão fixadas nas versões testadas.

[platformio]
default_envs = cardputer-adv
src_dir = src
boards_dir = boards

[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = m5stack-cardputer-adv
framework = arduino
board_build.partitions = default_8MB.csv
board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

build_flags =
  -DCORE_DEBUG_LEVEL=0
  -Wall
build_unflags =
  -Werror=all

lib_ldf_mode = chain
lib_deps =
  https://github.com/m5stack/M5GFX.git#0.2.34
  https://github.com/m5stack/M5Unified.git#0.2.27
  https://github.com/m5stack/M5Cardputer.git#f1392858b9994c3547120e602a57d3553d16ab01

extra_scripts = post:tools/pio_merge_bin.py
